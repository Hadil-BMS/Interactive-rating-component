<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rating component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="component-container" id="rating-card">
      <div class="logo">
        <img src="imgs/icon-star.svg" alt="">
      </div>
      <h2>How did we do?</h2>
      <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
      <div class="rank-btn" id="rank-btn">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
        <button>5</button>
      </div>
      <button class="submit-btn" id="submit-btn">Submit</button>
    </div>
    <div class="thank-you">
      <div class="thankYou">
        <div class="logoo">
        <img src="imgs/illustration-thank-you.svg" alt="">
        <p>You selected <span> X </span> out of 5</p>
        </div>
        
        <h2>Thank you!</h2>
        <p> We appreciate you taking the time to give a rating. If you ever need more support, don’t hesitate to get in touch!</p>
      </div>
      
    </div>

  </div>




  <script src="js.js"></script>
</body>
</html>
